<style>
:root{
  --bg:#f5f7f4;--bg2:#eef1ec;--card:#fff;
  --forest:#1a5c32;--forest2:#2a7a44;
  --pale:#e8f0ea;--pale2:#d4e4d9;
  --text:#151515;--muted:#6f746f;--soft:#9aa09a;
  --border:rgba(0,0,0,.075);--border2:rgba(0,0,0,.12);
  --radius:14px;
  --shadow:0 1px 3px rgba(0,0,0,.04);
  --font-ui:'Inter',system-ui,sans-serif;
  --font-display:'Lora',Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text);min-height:100dvh;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}
header{padding:18px 0 6px;position:sticky;top:0;z-index:40;background:linear-gradient(to bottom,var(--bg) 78%,rgba(245,247,244,0))}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:12px;text-decoration:none;color:inherit}
.brand .logo{width:34px;height:34px;border-radius:50%;background:var(--pale);border:1px solid var(--forest);display:flex;align-items:center;justify-content:center;font-size:17px}
.brand .name{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brand .name b{color:var(--text)}
h1{font-family:var(--font-display);font-weight:600;font-size:27px;line-height:1.15;margin-bottom:4px}
h1 em{color:var(--forest);font-style:italic}
.stats{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px;margin-bottom:12px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--forest)}
.searchbox{position:relative;margin-bottom:10px}
.searchbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.65}
.searchbox input{
  width:100%;padding:14px 42px;font-size:16px;font-family:var(--font-ui);
  background:var(--card);border:1px solid var(--border2);border-radius:var(--radius);
  color:var(--text);outline:none;box-shadow:var(--shadow);
}
.searchbox input:focus{border-color:var(--forest)}
.clear-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:20px;padding:6px 10px;cursor:pointer;display:none}
.add-row{display:flex;gap:8px;margin-bottom:12px}
.add-btn{
  flex:1;padding:11px 14px;border-radius:12px;border:1px solid var(--forest);
  background:var(--forest);color:#fff;font:600 13.5px var(--font-ui);cursor:pointer;
}
.add-btn.ghost{background:var(--card);color:var(--forest)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:7px 14px;border-radius:100px;font-size:12.5px;font-weight:500;
  background:var(--card);border:1px solid var(--border2);color:var(--muted);
  font-family:var(--font-ui);cursor:pointer;white-space:nowrap;
}
.chip.active{background:var(--pale);border-color:var(--forest);color:var(--forest);font-weight:600}
.count-line{font-size:12px;color:var(--muted);margin-bottom:10px;min-height:15px}
.count-line b{color:var(--forest)}
.list{display:flex;flex-direction:column;gap:10px}
.card{
  display:flex;gap:12px;align-items:center;background:var(--card);
  border:1px solid var(--border);border-radius:var(--radius);padding:12px;cursor:pointer;
  text-align:left;width:100%;font-family:var(--font-ui);color:var(--text);box-shadow:var(--shadow);
}
.card:active{transform:scale(.985);border-color:var(--forest)}
.thumb{
  width:58px;height:58px;flex:0 0 58px;border-radius:11px;background:var(--pale);
  display:flex;align-items:center;justify-content:center;border:1px solid var(--border);
}
.thumb img{width:28px;height:28px}
.thumb img.logo{width:100%;height:100%;object-fit:contain;padding:5px;background:#fff}
.card-body{flex:1;min-width:0}
.card-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.card-sub{font-size:11.5px;color:var(--forest);letter-spacing:.04em;text-transform:uppercase;font-weight:600;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--bg2);color:var(--muted);border:1px solid var(--border)}
.badge.ok{color:var(--forest);border-color:rgba(26,92,50,.25);background:var(--pale)}
.sk{height:82px;border-radius:var(--radius);background:linear-gradient(100deg,var(--bg2) 40%,var(--pale) 50%,var(--bg2) 60%);background-size:200% 100%;animation:shine 1.3s infinite;border:1px solid var(--border)}
@keyframes shine{to{background-position:-200% 0}}
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
.empty .big{font-family:var(--font-display);font-style:italic;font-size:19px;color:var(--text);display:block;margin-bottom:6px}
.more-btn{margin:14px auto 0;display:block;padding:11px 26px;border-radius:100px;background:var(--card);border:1px solid var(--forest);color:var(--forest);font:600 13.5px var(--font-ui);cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .22s;z-index:60}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:70;max-width:480px;margin:0 auto;
  background:var(--card);border:1px solid var(--border);border-bottom:none;
  border-radius:22px 22px 0 0;transform:translateY(102%);transition:transform .26s cubic-bezier(.3,.9,.3,1);
  max-height:88dvh;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.12);
}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:44px;height:4px;border-radius:4px;background:var(--border2);margin:10px auto 4px}
.sheet-scroll{overflow-y:auto;padding:8px 20px calc(28px + env(safe-area-inset-bottom))}
.sheet-title{font-family:var(--font-display);font-size:22px;font-weight:700;line-height:1.15}
.sheet-breeder{font-size:12px;color:var(--forest);letter-spacing:.05em;text-transform:uppercase;font-weight:600;margin-top:3px}
.section{margin-bottom:15px}
.section .k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.section p{font-size:13.5px;line-height:1.65}
.link-btn{display:block;text-align:center;margin-top:8px;padding:13px;border-radius:12px;background:var(--forest);color:#fff;font-weight:700;font-size:14px;text-decoration:none}
.link-btn.ghost{background:var(--pale);color:var(--forest);border:1px solid rgba(26,92,50,.2)}
.form-grid{display:flex;flex-direction:column;gap:10px;margin:12px 0 16px}
.form-grid label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.form-grid input,.form-grid textarea{
  width:100%;border:1px solid var(--border2);border-radius:10px;padding:11px;font:inherit;font-size:15px;margin-top:4px;
}
.rev-box{margin-top:22px;padding-top:16px;border-top:1px solid var(--border)}
.rev-box h3{font-size:15px;margin:0 0 10px}
.rev-avg,.rev-meta{font-size:13px;color:var(--muted);margin-bottom:10px}
.rev-stars{letter-spacing:1px;color:var(--forest);font-size:16px}
.rev-star{background:none;border:0;padding:0 1px;font-size:18px;color:var(--forest);cursor:default}
.rev-stars-in .rev-star{cursor:pointer}
.rev-item{padding:10px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.rev-item p{margin:6px 0 0;line-height:1.5}
.rev-empty,.rev-login{font-size:13px;color:var(--muted);margin:8px 0}
.rev-form{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.rev-lab{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rev-form textarea{width:100%;border:1px solid var(--border2);border-radius:10px;padding:10px;font:inherit;font-size:14px}
.rev-send{background:var(--forest);color:#fff;border:0;border-radius:10px;padding:11px;font-weight:700;cursor:pointer}
.rev-msg{font-size:12px;color:#b94b42}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);line-height:1.6;text-align:center}
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="brand" href="/">
      <div class="logo">🌿</div>
      <div class="name"><b>Cannabicultor IA</b> · Growers Alliance</div>
    </a>
    <h1>Growshops de <em>España</em></h1>
    <div class="stats"><span class="dot"></span><span id="statsLine">Cargando directorio…</span></div>
    <div class="searchbox">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6f746f" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Busca por nombre o ciudad…" autocomplete="off" enterkeyhint="search">
      <button class="clear-btn" id="clearBtn" aria-label="Borrar">×</button>
    </div>
    <div class="add-row">
      <button class="add-btn" id="addBtn" type="button">Añade tu growshop</button>
      <button class="add-btn ghost" id="sortBtn" type="button">Mejor valorados</button>
    </div>
  </header>

  <div class="chips" id="chips">
    <button class="chip active" data-f="">Todas</button>
  </div>
  <div class="count-line" id="countLine"></div>
  <div class="list" id="list"></div>
  <button class="more-btn" id="moreBtn" style="display:none">Cargar más</button>
  <footer>
    Directorio de growshops de Cannabicultor · reseñas de cultivadores reales.<br>
    Parte de los datos procede de <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>.<br>
    Solo mayores de 18 años. Consulta la legislación vigente.
  </footer>
</div>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-handle"></div>
  <div class="sheet-scroll" id="sheetContent"></div>
</div>

<script>
const SUPABASE_URL = "https://gfyrsrdnvgnhtsuexjkb.supabase.co";
const SUPABASE_KEY = "sb_publishable_FdRmfirvOTAIfZFOcj2ZZg_Vic__TDw";
const WORKER = "https://growers-alliance-ai.enriquedorta.workers.dev";
const HEADERS = { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY };
const PAGE = 25;
const CCAA_ORDER = ["Madrid","Cataluña","Andalucía","Comunitat Valenciana","Galicia","País Vasco","Canarias","Illes Balears","Castilla y León","Castilla-La Mancha","Aragón","Murcia","Asturias","Extremadura","Navarra","Cantabria","La Rioja"];

let query = "", filterCcaa = "", onlyRated = false, offset = 0, busy = false, lastToken = 0;

const $ = id => document.getElementById(id);
const list = $("list"), countLine = $("countLine"), moreBtn = $("moreBtn");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat("es-ES");

function jwt() {
  try { return localStorage.getItem("ga_jwt") || sessionStorage.getItem("ga_jwt") || ""; }
  catch (e) { return ""; }
}
function starsTxt(n) {
  const v = Math.round(Number(n) || 0);
  return "★".repeat(v) + "☆".repeat(5 - v);
}

async function pg(path, { count = false, signal } = {}) {
  const h = { ...HEADERS };
  if (count) h.Prefer = "count=exact";
  const r = await fetch(SUPABASE_URL + "/rest/v1/" + path, { headers: h, signal });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const total = count ? parseInt((r.headers.get("content-range") || "/0").split("/")[1], 10) : null;
  return { data: await r.json(), total };
}

function buildUrl() {
  const q = query.trim().replace(/[,()*]/g, " ").trim();
  let u = "growshops?select=id,slug,nombre,direccion,ciudad,provincia,ccaa,telefono,web,instagram,logo_url,lat,lon,verificado,media_resenas,num_resenas&activo=is.true";
  if (q) {
    const enc = encodeURIComponent(q);
    u += "&or=(nombre.ilike.*" + enc + "*,ciudad.ilike.*" + enc + "*,provincia.ilike.*" + enc + "*)";
  }
  if (filterCcaa) u += "&ccaa=eq." + encodeURIComponent(filterCcaa);
  if (onlyRated) u += "&num_resenas=gte.1";
  u += onlyRated
    ? "&order=media_resenas.desc.nullslast,num_resenas.desc,nombre.asc"
    : "&order=num_resenas.desc,nombre.asc";
  u += "&limit=" + PAGE + "&offset=" + offset;
  return u;
}

let controller;
async function load(reset) {
  if (busy) controller?.abort();
  busy = true;
  const token = ++lastToken;
  controller = new AbortController();
  if (reset) {
    offset = 0;
    list.innerHTML = '<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
    moreBtn.style.display = "none";
    countLine.textContent = "";
  }
  try {
    const { data, total } = await pg(buildUrl(), { count: true, signal: controller.signal });
    if (token !== lastToken) return;
    if (reset) list.innerHTML = "";
    if (!data.length && reset) {
      list.innerHTML = '<div class="empty"><span class="big">Aún no hay fichas aquí</span>Prueba otra comunidad o añade tu growshop para inaugurar la zona.</div>';
      countLine.textContent = "";
    } else {
      data.forEach(g => list.appendChild(cardEl(g)));
      countLine.innerHTML = "<b>" + nf.format(total) + "</b> growshop" + (total === 1 ? "" : "s") + " en el directorio";
      moreBtn.style.display = data.length === PAGE ? "block" : "none";
    }
  } catch (e) {
    if (e.name === "AbortError") return;
    if (reset) list.innerHTML = '<div class="empty"><span class="big">No se pudo cargar</span>Reintenta en unos segundos.</div>';
  } finally {
    if (token === lastToken) busy = false;
  }
}

function cardEl(g) {
  const btn = document.createElement("button");
  btn.className = "card";
  btn.type = "button";
  const place = [g.ciudad, g.provincia || g.ccaa].filter(Boolean).join(" · ");
  const rating = g.num_resenas
    ? '<span class="badge ok">' + starsTxt(g.media_resenas) + " " + esc(g.media_resenas) + " · " + g.num_resenas + "</span>"
    : '<span class="badge">Sin reseñas aún</span>';
  const logo = g.logo_url
    ? '<img class="logo" src="' + esc(g.logo_url) + '" alt="" onerror="this.className=\'\';this.src=\'assets/icons/12-growshop.svg\'">'
    : '<img src="assets/icons/12-growshop.svg" alt="">';
  btn.innerHTML =
    '<div class="thumb">' + logo + '</div>' +
    '<div class="card-body"><div class="card-title">' + esc(g.nombre) + '</div>' +
    '<div class="card-sub">' + esc(place || "España") + '</div>' +
    '<div class="badges">' + rating + (g.verificado ? '<span class="badge ok">Verificado</span>' : "") + "</div></div>";
  btn.onclick = () => openShop(g.id);
  return btn;
}

function openSheet(html) {
  $("sheetContent").innerHTML = html;
  $("overlay").classList.add("open");
  $("sheet").classList.add("open");
}
function closeSheet() {
  $("overlay").classList.remove("open");
  $("sheet").classList.remove("open");
}
$("overlay").onclick = closeSheet;

async function openShop(id) {
  openSheet('<div class="sk" style="height:140px"></div>');
  try {
    const { data } = await pg("growshops?select=*&id=eq." + id + "&activo=is.true&limit=1");
    const g = data[0];
    if (!g) return closeSheet();
    const maps = (g.lat && g.lon)
      ? "https://www.openstreetmap.org/?mlat=" + g.lat + "&mlon=" + g.lon + "#map=17/" + g.lat + "/" + g.lon
      : (g.direccion ? "https://www.openstreetmap.org/search?query=" + encodeURIComponent([g.direccion, g.ciudad, g.provincia].filter(Boolean).join(", ")) : "");
    const addr = [g.direccion, g.cp, g.ciudad, g.provincia].filter(Boolean).join(", ");
    const headLogo = g.logo_url
      ? '<img class="logo" src="' + esc(g.logo_url) + '" alt="" style="width:56px;height:56px;object-fit:contain;border:1px solid var(--border);border-radius:12px;background:#fff;padding:4px;margin-bottom:10px">'
      : "";
    openSheet(
      headLogo +
      '<div class="sheet-title">' + esc(g.nombre) + '</div>' +
      '<div class="sheet-breeder">' + esc([g.ciudad, g.ccaa].filter(Boolean).join(" · ") || "España") +
        (g.verificado ? " · verificado" : " · ficha abierta a reseñas") + '</div>' +
      (addr ? '<div class="section" style="margin-top:16px"><div class="k">Dirección</div><p>' + esc(addr) + '</p></div>' : "") +
      (g.telefono ? '<div class="section"><div class="k">Teléfono</div><p><a href="tel:' + esc(g.telefono) + '">' + esc(g.telefono) + '</a></p></div>' : "") +
      (g.horario ? '<div class="section"><div class="k">Horario</div><p>' + esc(g.horario) + '</p></div>' : "") +
      (g.web ? '<a class="link-btn" href="' + esc(g.web) + '" target="_blank" rel="noopener">Visitar web →</a>' : "") +
      (g.instagram ? '<a class="link-btn ghost" href="' + esc(igUrl(g.instagram)) + '" target="_blank" rel="noopener">Instagram</a>' : "") +
      (maps ? '<a class="link-btn ghost" href="' + esc(maps) + '" target="_blank" rel="noopener">Ver en el mapa</a>' : "") +
      '<div id="revMount"></div>'
    );
    if (window.CCResenas) CCResenas.mount(document.getElementById("revMount"), "growshop", g.id);
    history.replaceState(null, "", "#id=" + g.id);
  } catch {
    closeSheet();
  }
}

function igUrl(v) {
  const s = String(v || "").trim();
  if (/^https?:\/\//i.test(s)) return s;
  return "https://instagram.com/" + s.replace(/^@/, "");
}

function formHtml() {
  const logged = !!jwt();
  if (!logged) {
    return '<div class="sheet-title">Añade tu growshop</div><p class="section" style="margin-top:12px">Para publicar una ficha y empezar a recibir reseñas, <a href="/login.html?next=/growshops.html#anadir">inicia sesión</a>.</p>';
  }
  return (
    '<div class="sheet-title">Añade tu growshop</div>' +
    '<p class="section" style="margin-top:10px">La ficha se publica al momento y queda abierta a reseñas. La verificamos después, en la campaña con las tiendas.</p>' +
    '<form class="form-grid" id="addForm">' +
      '<div><label>Nombre de la tienda *</label><input name="nombre" required maxlength="120"></div>' +
      '<div><label>Ciudad *</label><input name="ciudad" required maxlength="80"></div>' +
      '<div><label>Provincia / comunidad</label><input name="provincia" maxlength="80"></div>' +
      '<div><label>Dirección</label><input name="direccion" maxlength="180"></div>' +
      '<div><label>Teléfono</label><input name="telefono" maxlength="40" inputmode="tel"></div>' +
      '<div><label>Web</label><input name="web" maxlength="180" placeholder="https://"></div>' +
      '<div><label>Instagram</label><input name="instagram" maxlength="80" placeholder="@tu_growshop"></div>' +
      '<div><label>Email de contacto</label><input name="email_contacto" type="email" maxlength="120"></div>' +
      '<div><label>Notas (opcional)</label><textarea name="notas_envio" rows="3" maxlength="400" placeholder="Horario, cómo llegar, especialidad…"></textarea></div>' +
      '<button class="add-btn" type="submit">Publicar ficha</button>' +
      '<p class="rev-msg" id="addMsg" hidden></p>' +
    '</form>'
  );
}

function openAdd() {
  openSheet(formHtml());
  history.replaceState(null, "", "#anadir");
  const form = $("addForm");
  if (!form) return;
  form.onsubmit = async (e) => {
    e.preventDefault();
    const msg = $("addMsg");
    const fd = new FormData(form);
    const body = {};
    fd.forEach((v, k) => { body[k] = String(v).trim(); });
    const btn = form.querySelector("button[type=submit]");
    btn.disabled = true;
    try {
      const r = await fetch(WORKER + "/growshops", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + jwt() },
        body: JSON.stringify(body)
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || "No se pudo guardar");
      closeSheet();
      await load(true);
      if (d.growshop && d.growshop.id) openShop(d.growshop.id);
    } catch (err) {
      btn.disabled = false;
      if (msg) { msg.hidden = false; msg.textContent = err.message || "Error"; }
    }
  };
}

async function loadChips() {
  try {
    const { data } = await pg("growshops?select=ccaa&activo=is.true");
    const set = new Set((data || []).map(r => r.ccaa).filter(Boolean));
    const ordered = CCAA_ORDER.filter(c => set.has(c)).concat([...set].filter(c => !CCAA_ORDER.includes(c)).sort());
    const wrap = $("chips");
    wrap.innerHTML = '<button class="chip active" data-f="">Todas</button>';
    ordered.forEach(c => {
      const b = document.createElement("button");
      b.className = "chip";
      b.dataset.f = c;
      b.textContent = c;
      wrap.appendChild(b);
    });
    wrap.querySelectorAll(".chip").forEach(c => {
      c.onclick = () => {
        wrap.querySelectorAll(".chip").forEach(x => x.classList.remove("active"));
        c.classList.add("active");
        filterCcaa = c.dataset.f || "";
        load(true);
      };
    });
  } catch { /* chips estáticos Todas */ }
}

(async () => {
  try {
    const { total } = await pg("growshops?select=id&activo=is.true&limit=1", { count: true });
    $("statsLine").textContent = nf.format(total) + " growshops · reseñas de cultivadores";
  } catch { $("statsLine").textContent = "Directorio de growshops · España"; }
})();

let debounce;
$("q").addEventListener("input", e => {
  query = e.target.value;
  $("clearBtn").style.display = query ? "block" : "none";
  clearTimeout(debounce);
  debounce = setTimeout(() => load(true), 280);
});
$("clearBtn").onclick = () => { $("q").value = ""; query = ""; $("clearBtn").style.display = "none"; load(true); };
$("addBtn").onclick = openAdd;
$("sortBtn").onclick = () => {
  onlyRated = !onlyRated;
  $("sortBtn").textContent = onlyRated ? "Ver todas" : "Mejor valorados";
  load(true);
};
moreBtn.onclick = () => { offset += PAGE; load(false); };

loadChips();
load(true);

if (location.hash === "#anadir") setTimeout(openAdd, 200);
const idMatch = location.hash.match(/id=(\d+)/);
if (idMatch) setTimeout(() => openShop(idMatch[1]), 250);
</script>
