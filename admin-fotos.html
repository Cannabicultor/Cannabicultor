<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex, nofollow">
<title>Fotos de variedades · Admin</title>
<style>
:root{--v:#0F3020;--b:#e1e6df;--t:#5b6b61;--r:#9b1c1c}
*{box-sizing:border-box}
body{margin:0;background:#f6f7f4;font-family:Inter,system-ui,sans-serif;color:#13201a}
.w{max-width:1080px;margin:28px auto;padding:0 18px}
h1{font-size:24px;margin:0 0 4px}
p.sub{color:var(--t);margin:0 0 18px;line-height:1.5}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tab{padding:8px 14px;border-radius:99px;border:1px solid var(--b);background:#fff;font:600 13.5px system-ui;cursor:pointer;color:var(--t)}
.tab.on{background:var(--v);color:#fff;border-color:var(--v)}
.sp{flex:1}
select{font:14px system-ui;padding:8px 10px;border:1px solid #cfd6cc;border-radius:10px;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--b);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.img{aspect-ratio:4/3;background:#eef2ec center/contain no-repeat;display:flex;align-items:center;justify-content:center;color:var(--t);font-size:13px}
.img img{width:100%;height:100%;object-fit:contain;background:#fff}
.body{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.n{font-weight:700;font-size:16px}
.meta{font-size:12.5px;color:var(--t);line-height:1.45}
.meta a{color:var(--v)}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;background:#eef2ec;color:var(--v);margin-right:4px}
.pill.w{background:#fff4dc;color:#7a5200}
.pill.s{background:#e3f3e7;color:#14602c}
label{font-size:12px;font-weight:600;color:var(--t);display:flex;flex-direction:column;gap:3px}
input{font:13.5px system-ui;padding:7px 9px;border:1px solid #cfd6cc;border-radius:8px;width:100%}
.acc{display:flex;gap:8px;margin-top:auto;padding-top:8px}
button{padding:9px 12px;border-radius:10px;border:1px solid var(--v);font:600 13.5px system-ui;cursor:pointer;background:#fff;color:var(--v);flex:1}
button.ok{background:var(--v);color:#fff}
button.no{border-color:var(--r);color:var(--r)}
button:disabled{opacity:.45;cursor:default}
.vacio{padding:40px;text-align:center;color:var(--t)}
#msg{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--v);color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;display:none;max-width:90vw;z-index:9}
.pie{display:flex;gap:10px;align-items:center;justify-content:center;margin:18px 0;color:var(--t);font-size:13px}
</style></head><body><div class="w">
<h1>Fotos de variedades</h1>
<p class="sub">Candidatas del buscador (criadores, licencias abiertas) y fotos subidas por usuarios. <b>Nada se publica hasta que lo apruebas.</b> Al aprobar, la imagen se copia a tu propio almacenamiento con su crédito; nunca se enlaza la web de origen.</p>

<div class="bar">
  <button class="tab on" data-e="pendiente">Pendientes <span id="c-pendiente"></span></button>
  <button class="tab" data-e="aprobada">Aprobadas <span id="c-aprobada"></span></button>
  <button class="tab" data-e="rechazada">Rechazadas <span id="c-rechazada"></span></button>
  <span class="sp"></span>
  <select id="origen"><option value="">Todo el origen</option><option value="candidata">Candidatas (buscador)</option><option value="usuario">Subidas de usuarios</option></select>
  <button id="lote" style="flex:none" title="Aprueba todas las visibles que traen permiso del criador o licencia abierta">Aprobar visibles con licencia</button>
</div>

<div id="lista" class="grid"></div>
<div class="pie"><button id="mas" style="flex:none;display:none">Cargar más</button></div>
</div><div id="msg"></div>

<script src="/assets/auth.js"></script>
<script src="/assets/config.js"></script>
<script>
var W=window.CC_CONFIG.WORKER_URL;
var jwt=window.GAAuth&&GAAuth.readSession?GAAuth.readSession():null;
if(!jwt){location.href='/login.html?next='+encodeURIComponent('/admin-fotos.html');}
var estado='pendiente',offset=0,PAG=24,items=[];
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(t){var m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){m.style.display='none';},4500);}
function api(d){return fetch(W+'/admin/fotos',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+jwt},body:JSON.stringify(d)}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j;});});}

function card(f){
  var tag=f.origen==='usuario'?'<span class="pill w">Subida de usuario</span>':'<span class="pill">Candidata</span>';
  var sc=f.score!=null?'<span class="pill s">confianza '+Math.round(f.score*100)+'%</span>':'';
  var lic=esc(f.licencia||'');
  var orig=f.landing_url?'<a href="'+esc(f.landing_url)+'" target="_blank" rel="noopener noreferrer">ver en origen ↗</a>':(f.usuario_email?esc(f.usuario_email):'');
  var acciones=estado==='pendiente'
    ?'<div class="acc"><button class="no" data-a="rechazar" data-id="'+f.id+'">Rechazar</button><button class="ok" data-a="aprobar" data-id="'+f.id+'">Aprobar</button></div>'
    :'<div class="meta">'+(f.motivo_rechazo?'Motivo: '+esc(f.motivo_rechazo):'')+(f.public_path?'Publicada: '+esc(f.public_path):'')+'</div>';
  var campos=estado==='pendiente'
    ?'<label>Licencia / permiso<input data-k="licencia" value="'+lic+'" placeholder="permiso-criador, cc0, by, by-sa…"></label><label>Autor / crédito<input data-k="autor" value="'+esc(f.autor||'')+'" placeholder="Nombre de quien hizo la foto"></label>'
    :'<div class="meta">Licencia: '+lic+(f.autor?' · '+esc(f.autor):'')+'</div>';
  return '<div class="card" id="c'+f.id+'"><div class="img">'+(f.vista?'<img loading="lazy" referrerpolicy="no-referrer" src="'+esc(f.vista)+'" alt="">':'sin vista previa')+'</div>'
   +'<div class="body"><div class="n">'+esc(f.variedad_nombre||('Variedad #'+f.variedad_id))+'</div>'
   +'<div class="meta">'+esc(f.breeder_nombre||'(criador desconocido)')+(f.variedad_tiene_foto?' · <b style="color:#9b1c1c">ya tiene foto</b>':'')+'</div>'
   +'<div>'+tag+sc+'</div><div class="meta">'+orig+'</div>'+campos+acciones+'</div></div>';
}
function pintar(reset){
  var l=$('lista');
  if(reset)l.innerHTML='';
  if(!items.length&&reset){l.innerHTML='<div class="vacio" style="grid-column:1/-1">No hay fotos '+estado+'s.</div>';return;}
  l.insertAdjacentHTML('beforeend',items.map(card).join(''));
}
function cargar(reset){
  if(reset){offset=0;items=[];}
  api({accion:'listar',estado:estado,origen:$('origen').value||undefined,limite:PAG,offset:offset}).then(function(r){
    items=r.items;offset+=r.items.length;
    ['pendiente','aprobada','rechazada'].forEach(function(e){$('c-'+e).textContent='('+r.conteo[e]+')';});
    pintar(reset);
    $('mas').style.display=offset<r.total?'inline-block':'none';
  }).catch(function(e){toast('Error: '+e.message);});
}
function leer(id){var c=$('c'+id);var o={};if(c)c.querySelectorAll('input[data-k]').forEach(function(i){o[i.getAttribute('data-k')]=i.value.trim();});return o;}
function actuar(id,a,extra){
  return api(Object.assign({accion:a,id:id},extra||{})).then(function(r){var c=$('c'+id);if(c)c.remove();toast(a==='aprobar'?'Aprobada y publicada':'Rechazada');cargarConteo();return r;});
}
function cargarConteo(){api({accion:'listar',estado:estado,limite:1}).then(function(r){['pendiente','aprobada','rechazada'].forEach(function(e){$('c-'+e).textContent='('+r.conteo[e]+')';});});}
$('lista').addEventListener('click',function(ev){
  var b=ev.target.closest('button[data-a]');if(!b)return;
  var id=b.getAttribute('data-id'),a=b.getAttribute('data-a');b.disabled=true;
  if(a==='aprobar'){var d=leer(id);if(!d.licencia){toast('Indica la licencia o el permiso antes de aprobar');b.disabled=false;return;}
    actuar(id,'aprobar',{licencia:d.licencia,autor:d.autor||undefined}).catch(function(e){toast('Error: '+e.message);b.disabled=false;});}
  else{var m=prompt('Motivo del rechazo (opcional):','');if(m===null){b.disabled=false;return;}
    actuar(id,'rechazar',{motivo:m}).catch(function(e){toast('Error: '+e.message);b.disabled=false;});}
});
document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});t.classList.add('on');estado=t.getAttribute('data-e');$('lote').style.display=estado==='pendiente'?'':'none';cargar(true);};});
$('origen').onchange=function(){cargar(true);};
$('mas').onclick=function(){cargar(false);};
$('lote').onclick=function(){
  var ids=[];document.querySelectorAll('.card').forEach(function(c){var id=c.id.slice(1);var d=leer(id);if(d.licencia&&d.licencia!=='desconocida')ids.push([id,d]);});
  if(!ids.length){toast('No hay tarjetas con licencia para aprobar');return;}
  if(!confirm('Vas a aprobar y PUBLICAR '+ids.length+' fotos. Revisa antes que son de la variedad correcta. ¿Continuar?'))return;
  var ok=0,ko=0;
  ids.reduce(function(p,x){return p.then(function(){return actuar(x[0],'aprobar',{licencia:x[1].licencia,autor:x[1].autor||undefined}).then(function(){ok++;}).catch(function(){ko++;});});},Promise.resolve()).then(function(){toast('Aprobadas '+ok+(ko?' · con error '+ko:''));});
};
cargar(true);
</script></body></html>
